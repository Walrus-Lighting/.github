name: Bug report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See the problem
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or environment
      description: App version, OS, device, or anything else relevant.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, or links are welcome.
